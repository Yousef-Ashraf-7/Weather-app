<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Weather App</title>
</head>
<body>
    <div class="container">

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter City Name" spellcheck="false">
            <button id="search"><img src="images/search.png" alt="Search"></button>
        </div>

        <div class="weather">
            <img src="images/clear.png" class="weather-icon" alt="Weather icon">
            <h1 class="temp">--°C</h1>
            <h2 class="city">Loading...</h2>

            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="Humidity">
                    <div>
                        <p class="humidity">--%</p>
                        <p>humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="images/wind.png" alt="Wind">
                    <div>
                        <p class="wind">-- km/h</p>
                        <p>wind speed</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
